[package]
name = "trox-cli"
description = "Fast source extractor and localization workflow CLI for Trox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["localization", "i18n", "translation", "cli"]
categories = ["command-line-utilities", "internationalization", "development-tools"]
publish = ["crates-io"]

[[bin]]
name = "trox"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
blake3.workspace = true
calamine.workspace = true
clap.workspace = true
csv.workspace = true
data-encoding.workspace = true
globset.workspace = true
indexmap.workspace = true
libc.workspace = true
rayon.workspace = true
regex.workspace = true
ron.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
trox = { version = "=0.2.1", path = "../trox" }
unicode-normalization.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"
