[workspace]
resolver = "2"
members = ["crates/trox", "crates/trox-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
data-encoding = "2.9"
globset = "0.4"
icu_locale_core = { version = "2.2", features = ["alloc"] }
indexmap = { version = "2.11", features = ["serde"] }
libc = "0.2"
rayon = "1.11"
regex = "1.11"
ron = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
tempfile = "3.20"
thiserror = "2.0"
unicode-normalization = "0.1"
walkdir = "2.5"
